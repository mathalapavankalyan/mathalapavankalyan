<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 260" role="img" aria-labelledby="t d">
  <title id="t">Pavankalyan Mathala</title>
  <desc id="d">Backend, Full-Stack and AI Engineer</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0b10"/>
      <stop offset="0.6" stop-color="#15120a"/>
      <stop offset="1" stop-color="#2a2008"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F5D76E"/>
      <stop offset="0.5" stop-color="#DAA520"/>
      <stop offset="1" stop-color="#B8860B"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#DAA520" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#DAA520" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#DAA520" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#DAA520" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <clipPath id="clip"><rect width="800" height="260" rx="18"/></clipPath>
  </defs>

  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .name { font-size: 50px; font-weight: 700; letter-spacing: 1px; }
    .role { font-size: 26px; font-weight: 500; fill: #EDE6D2; }
    .rise1 { animation: rise 0.9s ease-out both; }
    .rise2 { animation: rise 0.9s ease-out 0.25s both; }
    .rule  { transform-origin: 400px 196px; animation: grow 1s ease-out 0.5s both; }
    .beam  { animation: sweep 6s linear infinite; }
    .dot   { animation: drift 7s ease-in-out infinite alternate; }
    .dot2  { animation: drift 9s ease-in-out 1s infinite alternate; }
    .dot3  { animation: drift 8s ease-in-out 2s infinite alternate; }
    @keyframes rise  { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes grow  { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    @keyframes sweep { from { transform: translateX(-200px); } to { transform: translateX(900px); } }
    @keyframes drift { from { transform: translateY(0); } to { transform: translateY(-14px); } }
    @media (prefers-reduced-motion: reduce) {
      .rise1, .rise2, .rule, .beam, .dot, .dot2, .dot3 { animation: none; }
    }
  </style>

  <g clip-path="url(#clip)">
    <rect width="800" height="260" fill="url(#bg)"/>
    <rect width="800" height="260" fill="url(#grid)"/>
    <rect class="beam" x="0" y="0" width="200" height="260" fill="url(#sweep)"/>

    <circle class="dot"  cx="90"  cy="60"  r="5"  fill="#DAA520" fill-opacity="0.35"/>
    <circle class="dot2" cx="720" cy="80"  r="7"  fill="#DAA520" fill-opacity="0.25"/>
    <circle class="dot3" cx="660" cy="210" r="4"  fill="#F5D76E" fill-opacity="0.35"/>
    <circle class="dot2" cx="140" cy="215" r="6"  fill="#F5D76E" fill-opacity="0.20"/>

    <text class="mono name rise1" x="400" y="120" text-anchor="middle" fill="url(#gold)">PAVANKALYAN MATHALA</text>
    <text class="mono role rise2" x="400" y="166" text-anchor="middle">Backend · Full-Stack · AI Engineer</text>
    <rect class="rule" x="340" y="194" width="120" height="3" rx="1.5" fill="url(#gold)"/>
  </g>

  <rect x="1" y="1" width="798" height="258" rx="17" fill="none" stroke="#DAA520" stroke-opacity="0.45" stroke-width="2"/>
</svg>
